# DDoS Lab - Defense layer (reverse proxy with rate/connection limits)
# ---------------------------------------------------------------------
# Sits in front of the victim's HTTP service. Point a flood at `defense:80`
# instead of `victim:8080` and watch most of it get shed HERE (503) before it
# ever reaches the victim, keeping the victim green.
#
# NOTE (teaching point): these limits key on client IP ($binary_remote_addr).
# In the lab the generator is a single source, so per-IP limits are very
# effective. A real *distributed* DoS spreads across many IPs, which is why
# production defenses add upstream scrubbing, anycast, WAF rules, and
# challenge/CAPTCHA on top of per-IP limits. See docs/concepts.md.

worker_processes auto;
events { worker_connections 2048; }

http {
    access_log off;

    # 10 requests/sec per client IP, with a small burst allowance.
    limit_req_zone  $binary_remote_addr  zone=perip:10m  rate=10r/s;
    # At most 10 concurrent connections per client IP.
    limit_conn_zone $binary_remote_addr  zone=connperip:10m;

    limit_req_status  503;
    limit_conn_status 503;

    upstream victim_http { server victim:8080; keepalive 32; }

    server {
        listen 80;

        location / {
            limit_req  zone=perip burst=20 nodelay;
            limit_conn connperip 10;

            proxy_pass http://victim_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # nginx's own view of what it's shedding vs. forwarding.
        location = /nginx_status {
            stub_status;
        }
    }
}
